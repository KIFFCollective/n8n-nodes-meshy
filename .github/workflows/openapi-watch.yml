# Weekly check: has Meshy's live OpenAPI spec changed since we vendored it?
# If so, open (or update) an issue with the diff so someone can regenerate.
name: OpenAPI change detector

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the live spec
        run: curl -fsSL https://docs.meshy.ai/openapi.yaml -o /tmp/openapi.yaml

      - name: Compare with the vendored copy
        id: diff
        run: |
          if diff -u docs/vendor/openapi.yaml /tmp/openapi.yaml > /tmp/openapi.diff; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update an issue
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Meshy OpenAPI spec changed"
          {
            echo "The live spec at https://docs.meshy.ai/openapi.yaml differs from docs/vendor/openapi.yaml."
            echo
            echo "To update: copy the new spec into docs/vendor/openapi.yaml, run \`npm run generate\`, review, and commit."
            echo
            echo '```diff'
            head -c 60000 /tmp/openapi.diff
            echo '```'
          } > /tmp/body.md
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/body.md
          else
            gh issue create --title "$title" --body-file /tmp/body.md
          fi
