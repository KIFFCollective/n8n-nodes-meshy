name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Fails if someone edited openapi.yaml or the generator without regenerating.
      - name: Generator drift check
        run: npm run generate:check

      # Fails if the published tarball is missing the built nodes or ships extra files.
      - name: Packed artifact check
        run: node scripts/check-pack.mjs
